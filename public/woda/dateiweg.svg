<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Dateiweg, schematisch">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0F766E"/>
    </marker>
    <symbol id="envelope" viewBox="0 0 48 40">
      <rect x="1.5" y="1.5" width="45" height="37" rx="5" fill="#FFFFFF" stroke="#14304A" stroke-width="2"/>
      <path d="M3 5l21 16L45 5" fill="none" stroke="#14304A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Schloss -->
      <rect x="18" y="24" width="12" height="10" rx="2" fill="#0F766E"/>
      <path d="M20.5 24v-3a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#0F766E" stroke-width="2"/>
    </symbol>
    <symbol id="seal" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="9" fill="#5EEAD4" stroke="#0F766E" stroke-width="1.5"/>
      <path d="M5.5 10.5l3 3 6-6.5" fill="none" stroke="#14304A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect width="640" height="260" rx="12" fill="#EAF4FC"/>
  <!-- links: Wasserwerk (Gebäude mit Wassertropfen), umrahmt = bleibt lokal -->
  <g transform="translate(40,50)">
    <rect x="0" y="0" width="150" height="160" rx="12" fill="#FFFFFF" stroke="#14304A" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M30 120V70l45-32 45 32v50z" fill="#EAF4FC" stroke="#14304A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="62" y="88" width="26" height="32" fill="#14304A"/>
    <path d="M75 48c6 7.5 11 13.5 11 19.5a11 11 0 0 1-22 0c0-6 5-12 11-19.5z" fill="#0F766E"/>
    <!-- kleines Schloss = offline -->
    <rect x="118" y="14" width="20" height="16" rx="3" fill="#0F766E"/>
    <path d="M122 14v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#0F766E" stroke-width="2.5"/>
    <!-- Ampelpunkte: L1 lokal -->
    <circle cx="45" cy="140" r="6" fill="#16A34A"/><circle cx="65" cy="140" r="6" fill="#16A34A"/><circle cx="85" cy="140" r="6" fill="#EAB308"/><circle cx="105" cy="140" r="6" fill="#16A34A"/>
  </g>
  <!-- rechts: Ingenieure (zwei Personen mit Schutzhelm) -->
  <g transform="translate(450,50)">
    <rect x="0" y="0" width="150" height="160" rx="12" fill="#FFFFFF" stroke="#14304A" stroke-width="2"/>
    <g fill="#14304A">
      <circle cx="58" cy="70" r="16"/>
      <path d="M40 66a18 18 0 0 1 36 0z" fill="#0F766E"/>
      <path d="M28 128c0-20 13-32 30-32s30 12 30 32z"/>
      <circle cx="102" cy="78" r="13"/>
      <path d="M87.5 75a14.5 14.5 0 0 1 29 0z" fill="#0F766E"/>
      <path d="M78 128c0-16 10-26 24-26s24 10 24 26z"/>
    </g>
    <!-- Lupe -->
    <circle cx="122" cy="34" r="11" fill="none" stroke="#0F766E" stroke-width="3"/>
    <path d="M130 42l9 9" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Pfeile mit Umschlägen -->
  <g stroke="#0F766E" stroke-width="2.5" fill="none">
    <path d="M200 95H432" marker-end="url(#arr)"/>
    <path d="M440 165H208" marker-end="url(#arr)"/>
  </g>
  <use href="#envelope" x="296" y="60" width="48" height="40"/>
  <use href="#seal" x="332" y="52" width="20" height="20"/>
  <use href="#envelope" x="296" y="140" width="48" height="40"/>
  <use href="#seal" x="288" y="132" width="20" height="20"/>
</svg>
